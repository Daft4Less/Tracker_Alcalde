<div class="min-h-screen bg-primary flex items-center justify-center px-4 py-12 relative overflow-hidden">
  <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-primary-container/60 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-secondary/20 blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden border border-surface-variant/40">
      <div class="bg-primary px-8 pt-8 pb-6 text-center relative overflow-hidden">
        <div class="absolute -right-6 -top-6 w-24 h-24 bg-primary-container rounded-full opacity-40 pointer-events-none"></div>
        <div class="w-16 h-16 rounded-2xl bg-secondary-container text-primary flex items-center justify-center mx-auto shadow-lg">
          <span class="material-symbols-outlined text-[34px]">admin_panel_settings</span>
        </div>
        <h1 class="font-headline-lg text-headline-lg text-on-primary tracking-tight mt-4">Panel de Auditoría</h1>
        <p class="font-body-sm text-body-sm text-on-primary/60 mt-1">Acceso restringido · Alcalde Tracker Quito</p>
      </div>

      <div class="p-8">
        <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
          <div class="flex flex-col gap-space-2xs">
            <label class="font-label-md text-label-md text-primary">Usuario</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
              <input
                type="text"
                name="username"
                [(ngModel)]="username"
                autocomplete="username"
                placeholder="Usuario del administrador"
                class="w-full bg-surface-container-low text-on-surface placeholder:text-on-surface-variant font-body-md text-body-md rounded-lg pl-10 pr-4 py-3 outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#001428] transition-all"
              />
            </div>
          </div>

          <div class="flex flex-col gap-space-2xs">
            <label class="font-label-md text-label-md text-primary">Contraseña</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
              <input
                type="password"
                name="password"
                [(ngModel)]="password"
                autocomplete="current-password"
                placeholder="••••••••"
                class="w-full bg-surface-container-low text-on-surface placeholder:text-on-surface-variant font-body-md text-body-md rounded-lg pl-10 pr-4 py-3 outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#001428] transition-all"
              />
            </div>
          </div>

          <div *ngIf="errorMessage" class="bg-error-container text-on-error-container font-label-sm text-label-sm rounded-lg px-4 py-3 flex items-center gap-2">
            <span class="material-symbols-outlined text-[18px]">error</span>
            <span>{{ errorMessage }}</span>
          </div>

          <button
            type="submit"
            [disabled]="loading"
            class="w-full bg-secondary hover:bg-on-secondary-container text-on-secondary font-label-md text-label-md font-semibold rounded-lg py-3.5 shadow-md transition-all flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            <span *ngIf="!loading" class="material-symbols-outlined text-[20px]">verified_user</span>
            <span *ngIf="loading" class="inline-block w-5 h-5 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
            <span>{{ loading ? 'Verificando credenciales...' : 'Iniciar Sesión' }}</span>
          </button>
        </form>

        <div class="mt-6 flex items-center justify-center gap-2 text-on-surface-variant font-label-sm text-label-sm">
          <span class="material-symbols-outlined text-[16px] text-secondary">lock</span>
          <span>Autenticación JWT · Sesión cifrada</span>
        </div>
      </div>
    </div>

    <a routerLink="/" class="mt-6 flex items-center justify-center gap-2 text-on-primary/50 hover:text-on-primary font-label-md text-label-md transition-colors">
      <span class="material-symbols-outlined text-[18px]">arrow_back</span>
      Volver al portal público
    </a>
  </div>
</div>
