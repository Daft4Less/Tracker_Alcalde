<div class="map-card-wrapper">
  <div class="map-card-header">
    <div class="header-title-box">
      <span class="material-symbols-rounded map-header-icon">location_on</span>
      <div>
        <h3 class="map-heading">Mapa de Geolocalización de Obras - Quito, Ecuador</h3>
        <p class="map-subheading">Ubicación de proyectos y promesas municipales en los distritos Norte, Centro y Sur de Quito.</p>
      </div>
    </div>
    <span class="location-badge">Quito - Pichincha</span>
  </div>

  <div #mapContainer class="leaflet-map-container" [style.height]="mapHeight"></div>
</div>
