<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Alcalde Tracker Quito</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Redirección automática hacia la carpeta docs/ para GitHub Pages
    (function() {
      var path = window.location.pathname;
      if (!path.includes('/docs/')) {
        var target = path.replace(/\/$/, '') + '/docs/' + window.location.search + window.location.hash;
        window.location.replace(target);
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=docs/">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #001428; color: #ffffff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .loader-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 2rem 3rem; border-radius: 1rem; backdrop-filter: blur(10px); }
    a { color: #00A3E0; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <div class="loader-card">
    <h2>Alcalde Tracker Quito</h2>
    <p>Cargando plataforma de auditoría cívica...</p>
    <p><a href="docs/">Si la página no carga en unos segundos, haz clic aquí</a></p>
  </div>
</body>
</html>
